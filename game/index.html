<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cala Dorada — a sun-soaked open-world crime game</title>
<meta name="description" content="Cala Dorada: steal cars, run six jobs for the Solano crew and outrun the Guardia Costera — with traffic, pedestrians, a five-star chase and a helicopter — in an original open-world crime game that runs offline in your browser.">
<meta name="theme-color" content="#120a16">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120a16'/%3E%3Ccircle cx='32' cy='34' r='15' fill='%23ffc14d'/%3E%3Cpath d='M0 46h64v18H0z' fill='%232f8f9c'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d12; }
  body { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; touch-action: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #ffe9c9;
          background: radial-gradient(120% 90% at 50% 30%, #2a1830 0%, #120a16 60%, #08060c 100%);
          letter-spacing: .22em; font-size: 13px; text-transform: uppercase; transition: opacity .35s; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .card { text-align: center; display: grid; gap: 14px; justify-items: center; }
  #boot b { color: #ff4d8d; font-weight: 800; letter-spacing: .34em; }
  #boot .sun { width: 76px; height: 76px; border-radius: 50%;
               background: radial-gradient(circle at 50% 38%, #fff0c8 0%, #ffc14d 42%, #ff6f61 70%, rgba(255,111,97,0) 72%);
               box-shadow: 0 0 44px rgba(255,150,110,.45); }
  #boot .bar { width: 210px; height: 2px; background: rgba(255,233,201,.16); overflow: hidden; }
  #boot .bar i { display: block; width: 42%; height: 100%; background: #ff4d8d; animation: load 1.1s ease-in-out infinite; }
  #boot small { letter-spacing: .18em; font-size: 9.5px; color: rgba(255,233,201,.45); }
  @keyframes load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; color: #ffe9c9; background: #0a0d12; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720" aria-label="Cala Dorada: an open-world crime game. Drive, shoot and run six jobs in a sun-soaked coastal city."></canvas>
<div id="boot"><div class="card">
  <span class="sun" aria-hidden="true"></span>
  <span><b>CALA DORADA</b></span>
  <span class="bar"><i></i></span>
  <small id="boot-line">building the coast…</small>
</div></div>
<noscript>Cala Dorada needs JavaScript: the whole city is built in the browser.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
